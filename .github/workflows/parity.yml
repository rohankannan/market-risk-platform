# Does the deployed stack actually run main?
#
# Deliberately NOT on push. A deploy takes minutes to land, so a push-triggered
# parity check would be red for a legitimate reason on every commit - and a
# check that is routinely red teaches you to ignore it, which is the same
# silent-drift failure this exists to prevent, wearing a different hat.
#
# Daily, after the nightly batch, is the cadence that stays trustworthy: green
# means the deployment matches main, red means it genuinely does not.
name: parity

on:
  schedule:
    - cron: "0 13 * * 1-5"        # 09:00 America/New_York, after the 23:30 UTC batch
  workflow_dispatch:

jobs:
  prod-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e .
      - name: Deployed stack vs this commit
        run: make prod-check PY=python
