name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Secret scan (cheap guard)
        run: |
          ! grep -rEn "(api_key|password|secret)[\"']?\s*[:=]\s*[\"'][A-Za-z0-9]{16,}" \
            --include="*.py" --include="*.yaml" --include="*.yml" --include="*.toml" \
            --exclude-dir=.venv . || (echo "possible hardcoded secret" && exit 1)
      - name: Tests
        run: pytest
