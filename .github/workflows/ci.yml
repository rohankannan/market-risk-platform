name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Secret scan (cheap guard)
        run: |
          ! grep -rEn "(api_key|password|secret)[\"']?\s*[:=]\s*[\"'][A-Za-z0-9]{16,}" \
            --include="*.py" --include="*.yaml" --include="*.yml" --include="*.toml" \
            --exclude-dir=.venv . || (echo "possible hardcoded secret" && exit 1)
      - name: Tests
        run: pytest
      - name: OpenAPI drift check
        run: |
          make openapi PY=python
          git diff --exit-code web/openapi.json
      - name: Fixture provenance (no dirty-tree stamps)
        run: |
          ! grep -rn -- '\-dirty"' web/src/mocks/fixtures web/public/snapshot.json || (echo "fixtures recorded from a dirty tree" && exit 1)

  # the dashboard: generated types must match the committed OpenAPI document,
  # then vitest against the recorded fixtures and a production build
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Typegen drift check
        run: |
          npm run typegen
          git diff --exit-code src/api/schema.d.ts
      - name: Tests
        run: npm test
      - name: Build (includes tsc --noEmit)
        run: npm run build

  # the README quickstart, executed: migrate -> seed -> backfill -> EOD against
  # a real Postgres, all offline from the committed snapshot, then an API smoke
  pipeline:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: riskdesk
          POSTGRES_PASSWORD: riskdesk
          POSTGRES_DB: riskdesk
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U riskdesk -h 127.0.0.1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://riskdesk:riskdesk@localhost:5432/riskdesk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e .
      - name: Migrate + seed + backfill + EOD
        run: make migrate seed backfill eod PY=python ALEMBIC=alembic
      - name: API smoke
        run: |
          uvicorn api.main:app --port 8000 &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8000/healthz >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8000/healthz
          curl -sf "http://127.0.0.1:8000/api/v1/risk/summary" | python -c "import json,sys; s=json.load(sys.stdin); f=[d for d in s['desks'] if d['is_aggregate']][0]; assert f['var_hs_1d'] == 1137118.30, f; assert f['limit_status'] == 'OK', f; print('firm VaR99 1d reproduced to the cent:', f['var_hs_1d'])"
          curl -sf "http://127.0.0.1:8000/api/v1/scenarios/results" | python -c "import json,sys; s=json.load(sys.stdin); assert len(s['results']) == 5, s; print('scenarios:', [r['scenario_code'] for r in s['results']])"
          curl -sf "http://127.0.0.1:8000/api/v1/risk/exposures" | python -c "import json,sys; s=json.load(sys.stdin); rates=[r for r in s['rows'] if r['desk_code']=='RATES']; assert len(rates) == 5 and s['unit'] == 'USD per 1bp', s; assert any(v['desk_code'] == 'EQUITY' for v in s['vega']), s; print('KRD nodes:', [f\"{r['factor_code']}={r['value']:,.0f}\" for r in rates], '+ vega')"
          curl -sf "http://127.0.0.1:8000/api/v1/backtest/pla?scope=EQUITY" | python -c "import json,sys; s=json.load(sys.stdin); assert s['n_obs'] >= 250 and s['zone'] in ('GREEN','AMBER','RED'), s; print('PLA EQUITY:', s['spearman'], s['ks'], s['zone'])"
          curl -sf "http://127.0.0.1:8000/api/v1/scenarios" | python -c "import json,sys; s=json.load(sys.stdin); assert len(s['scenarios']) == 5, s; r=[x for x in s['scenarios'] if x['scenario_type']=='HISTORICAL_REPLAY']; assert all(x['window_start'] and not x['shocks'] for x in r), r; print('catalog:', [x['scenario_code'] for x in s['scenarios']])"
          curl -sf "http://127.0.0.1:8000/api/v1/risk/movers" | python -c "import json,sys; s=json.load(sys.stdin); assert s['rows'] and all(len(r['drivers']) == 3 for r in s['rows']), s; print('movers:', [(r['desk_code'], r['delta_usd']) for r in s['rows']])"
          curl -sf "http://127.0.0.1:8000/api/v1/desks/RATES/decomposition" | python -c "import json,sys; s=json.load(sys.stdin); t=round(sum(b['standalone_var'] for b in s['buckets'])+s['diversification'],2); assert t == s['var_hs_1d'], (t, s['var_hs_1d']); print('RATES waterfall reconciles to the cent:', t)"
          curl -sf "http://127.0.0.1:8000/api/v1/desks/EQUITY/positions" | python -c "import json,sys; s=json.load(sys.stdin); assert len(s['positions']) == 9, s; legs=[p for p in s['positions'] if p['instrument_type']=='OPTION']; assert len(legs) == 2 and all(p['option_type'] for p in legs), legs; print('EQUITY positions:', len(s['positions']), 'incl both collar legs')"
          curl -sf "http://127.0.0.1:8000/api/v1/modeldoc" | python -c "import json,sys; s=json.load(sys.stdin); assert len(s['markdown']) > 10000, len(s['markdown']); print('modeldoc served:', len(s['markdown']), 'chars')"

  # the acceptance path: clone -> docker compose up -> both surfaces serve
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose up (build + bootstrap + serve)
        run: GIT_SHA=$(git rev-parse --short HEAD) docker compose up -d --build
      - name: Wait for the API, then check both surfaces
        run: |
          for i in $(seq 1 90); do curl -sf http://localhost:8000/healthz >/dev/null && break; sleep 2; done
          curl -sf http://localhost:8000/healthz
          curl -sf http://localhost:8000/api/v1/meta | python3 -c "import json,sys; m=json.load(sys.stdin); assert m['latest_as_of'], m; print('as of', m['latest_as_of'], m['batch_status'])"
          for i in $(seq 1 30); do curl -sf http://localhost:8501/_stcore/health >/dev/null && break; sleep 2; done
          curl -sf http://localhost:8501/_stcore/health
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 120
      - name: Down
        if: always()
        run: docker compose down -v
