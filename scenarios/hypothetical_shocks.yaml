# Hypothetical shocks, applied instantaneously by stress.apply_scenario.
#
# Two kinds of row, and the distinction is the point:
#
#   SENSITIVITY - one factor class moved uniformly by a round, supervisory-style
#   magnitude. The roundness is deliberate: these are ladders for reading the
#   book's directional exposure, not forecasts, and a +100bp parallel shift is
#   the number every rates desk quotes. What they are NOT is arbitrary - each
#   magnitude's measured severity on the committed snapshot is cited below and
#   regenerated by `python -m risk.jobs.calibrate_stress` into
#   docs/stress_calibration.md (overlapping 20-business-day moves, 4,966
#   windows, 2007-02-01 to 2026-08-06).
#
#   SCENARIO - many classes moving together, calibrated from the data rather
#   than chosen: the conditional tail mean, i.e. the average move of every
#   factor over the 50 windows where SPY sat at or below its 1st percentile.
#   Co-movement comes from history, not from one magnitude reused everywhere.
#
# Shock values are in each factor's own return convention (RELATIVE = log
# return on a LOG factor, ABSOLUTE_BP = basis points on an ABS_BP factor,
# ABSOLUTE = points on an ABS factor); the batch validates the pairing.
#
# CCAR-style macro paths with beta fill rules remain a winter deliverable -
# the Fed publishes macro variables, not factor shocks, and that mapping is
# the exercise.

- code: RATES_UP_100
  name: Parallel rates +100bp
  type: HYPOTHETICAL
  class: SENSITIVITY
  description: >-
    Uniform +100bp across the curve - the standard rates sensitivity ladder.
    Severity on this snapshot: 99.64th percentile of 20-day 10Y moves, reached
    in 18 of 4,966 windows (2022 delivered +258bp over ten months). Uniform by
    construction, so it reads DV01 rather than curve shape; the front end is
    not this parallel in practice.
  shocks:
    IR.UST.3M:  {type: ABSOLUTE_BP, value: 100}
    IR.UST.2Y:  {type: ABSOLUTE_BP, value: 100}
    IR.UST.5Y:  {type: ABSOLUTE_BP, value: 100}
    IR.UST.10Y: {type: ABSOLUTE_BP, value: 100}
    IR.UST.30Y: {type: ABSOLUTE_BP, value: 100}

- code: EQUITY_DOWN_20
  name: Equities -20%
  type: HYPOTHETICAL
  class: SENSITIVITY
  description: >-
    Broad -20% equity selloff with a +20pt vol bid. Severity: 99.52nd
    percentile of 20-day SPY moves, reached in 24 of 4,966 windows. Single-name
    betas are deliberately ignored (NVDA's own p99 is roughly twice SPY's), and
    rates are left unshocked - see RISK_OFF for what the data says actually
    happens to rates in an equity selloff.
  shocks:
    EQ.SPY:  {type: RELATIVE, value: -0.223}   # ln(0.8)
    EQ.AAPL: {type: RELATIVE, value: -0.223}
    EQ.MSFT: {type: RELATIVE, value: -0.223}
    EQ.NVDA: {type: RELATIVE, value: -0.223}
    EQ.JPM:  {type: RELATIVE, value: -0.223}
    EQ.XOM:  {type: RELATIVE, value: -0.223}
    EQ.JNJ:  {type: RELATIVE, value: -0.223}
    VOL.SPX.IV30: {type: ABSOLUTE, value: 20}

- code: USD_UP_10
  name: Broad USD +10%
  type: HYPOTHETICAL
  class: SENSITIVITY
  description: >-
    Every pair down 10% against the dollar. Severity: 99.78th percentile of
    20-day EURUSD moves, reached in 11 of 4,966 windows. Uniform across pairs
    by construction - MXN's measured p99 is half again EUR's - so this reads
    aggregate FX delta, not relative-value risk.
  shocks:
    FX.EURUSD: {type: RELATIVE, value: -0.105}  # ln(0.9)
    FX.GBPUSD: {type: RELATIVE, value: -0.105}
    FX.JPYUSD: {type: RELATIVE, value: -0.105}
    FX.MXNUSD: {type: RELATIVE, value: -0.105}

- code: RISK_OFF
  name: Correlated risk-off
  type: HYPOTHETICAL
  class: SCENARIO
  description: >-
    The cross-asset move the sensitivity ladders cannot express: equities down
    with a vol spike, a flight-to-quality rally that steepens from the front
    end, the yen bid and the peso sold. Every magnitude is the conditional tail
    mean over the 50 windows where 20-day SPY sat at or below its 1st
    percentile - measured co-movement, not a magnitude reused across classes.
    Regenerate with `python -m risk.jobs.calibrate_stress`.
  shocks:
    EQ.SPY:  {type: RELATIVE, value: -0.2285}
    EQ.AAPL: {type: RELATIVE, value: -0.2092}
    EQ.MSFT: {type: RELATIVE, value: -0.1495}
    EQ.NVDA: {type: RELATIVE, value: -0.2358}
    EQ.JPM:  {type: RELATIVE, value: -0.2379}
    EQ.XOM:  {type: RELATIVE, value: -0.2226}
    EQ.JNJ:  {type: RELATIVE, value: -0.1273}
    VOL.SPX.IV30: {type: ABSOLUTE, value: 28.999}
    IR.UST.3M:  {type: ABSOLUTE_BP, value: -56.46}
    IR.UST.2Y:  {type: ABSOLUTE_BP, value: -46.90}
    IR.UST.5Y:  {type: ABSOLUTE_BP, value: -36.00}
    IR.UST.10Y: {type: ABSOLUTE_BP, value: -25.08}
    IR.UST.30Y: {type: ABSOLUTE_BP, value: -28.94}
    FX.EURUSD: {type: RELATIVE, value: -0.0331}
    FX.GBPUSD: {type: RELATIVE, value: -0.0551}
    FX.JPYUSD: {type: RELATIVE, value: 0.0232}
    FX.MXNUSD: {type: RELATIVE, value: -0.1557}
